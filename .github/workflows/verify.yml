name: Verify

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - name: Require registry-distributed Weaver dependencies
        run: bun run verify:registry-consumer
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run truthful CI entrypoint
        run: bun run verify:ci
